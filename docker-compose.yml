
services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: laptopwise-backend
    ports:
      - "5000:5000"
    env_file:
      - ./Backend/.env
    environment:
      CLIENT_URL: http://localhost:8081
      PORT: 5000
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: laptopwise-frontend
    ports:
      - "8081:10000"
    depends_on:
      - backend
    restart: unless-stopped
