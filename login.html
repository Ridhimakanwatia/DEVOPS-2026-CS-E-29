<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Sign in to Spec Match to pick up your saved laptop and PC recommendations.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='6' width='24' height='15' fill='none' stroke='%231F3E82' stroke-width='2'/%3E%3Crect x='2' y='23' width='28' height='3' fill='%231F3E82'/%3E%3C/svg%3E">
<title>Sign in — Spec Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<button id="themeToggle" type="button">Dark mode</button>

<div class="stage">

  <div class="ticket-pane">
    <div class="ticket">
      <div class="ticket-head">
        <span class="badge">SM · 2026</span>
      </div>
      <div class="perf"></div>

      <div class="ticket-body">
        <h1>Sign in</h1>
        <p class="sub">Pick up where you left off.</p>

        <div id="error">Enter both a valid email and password to continue.</div>

        <form id="loginForm" novalidate>
          <div class="field">
            <div class="lab"><span class="num">01</span><span>Email</span></div>
            <div class="input-wrap">
              <input type="email" id="email" placeholder="name@example.com" autocomplete="username">
            </div>
          </div>

          <div class="field">
            <div class="lab"><span class="num">02</span><span>Password</span></div>
            <div class="input-wrap">
              <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
              <button type="button" class="toggle-pw" id="togglePw">Show</button>
            </div>
          </div>

          <div class="row-between">
            <label class="remember">
              <input type="checkbox" id="remember">
              Keep me signed in
            </label>
            <a href="#" class="link">Forgot password?</a>
          </div>

          <button type="submit" id="signin">Sign in →</button>
        </form>

        <p class="footer-note">New here? <a href="signup.html">Create an account</a></p>
      </div>
    </div>
  </div>

</div>

<script src="js/login.js"></script>

</body>
</html>
