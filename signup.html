<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — Spec Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/signup.css">
</head>
<body>

<button id="themeToggle" type="button">Light mode</button>

<div class="stage">
  <div class="ticket-pane">
    <div class="ticket">
      <div class="ticket-head">
        <span class="id">NEW MEMBER — REGISTRATION</span>
        <span class="badge">SM · 2026</span>
      </div>
      <div class="perf"></div>

      <div class="ticket-body">
        <h1>Create account</h1>
        <p class="sub">Set up your profile to start saving matches.</p>

        <div id="error">Check the highlighted field(s) below.</div>

        <form id="signupForm" novalidate>
          <div class="field">
            <div class="lab"><span class="num">01</span><span>Full name</span></div>
            <div class="input-wrap">
              <input type="text" id="name" placeholder="Ridhima Kanwatia" autocomplete="name">
            </div>
          </div>

          <div class="field">
            <div class="lab"><span class="num">02</span><span>Email</span></div>
            <div class="input-wrap">
              <input type="email" id="email" placeholder="name@example.com" autocomplete="username">
            </div>
          </div>

          <div class="field">
            <div class="lab"><span class="num">03</span><span>Password</span></div>
            <div class="input-wrap">
              <input type="password" id="password" placeholder="••••••••" autocomplete="new-password">
              <button type="button" class="toggle-pw" data-target="password">Show</button>
            </div>
            <p class="hint">At least 8 characters.</p>
          </div>

          <div class="field">
            <div class="lab"><span class="num">04</span><span>Confirm password</span></div>
            <div class="input-wrap">
              <input type="password" id="confirm" placeholder="••••••••" autocomplete="new-password">
              <button type="button" class="toggle-pw" data-target="confirm">Show</button>
            </div>
          </div>

          <label class="terms">
            <input type="checkbox" id="terms">
            I agree to the Terms and Privacy Policy
          </label>

          <button type="submit" id="createBtn">Create account →</button>
        </form>

        <div class="alt-row">
          <button class="alt-btn" type="button">Google</button>
          <button class="alt-btn" type="button">Guest</button>
        </div>

        <p class="footer-note">Already have an account? <a href="login.html">Sign in</a></p>
      </div>
    </div>
  </div>
</div>

<script src="js/signup.js"></script>
</body>
</html>
